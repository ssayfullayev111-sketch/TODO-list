<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="todo-container">

        <h2>TODO LIST</h2>

        <div class="input-box">
            <input type="text" id="search" placeholder="Search note...">
            <button id="send">SEND</button>
            <button id="theme">☾</button>
        </div>

        <div id="notes">
            <div class="note">
                <input type="checkbox">
                <span>NOTE #1</span>
                <div class="actions">
                    <button class="edit">✎</button>
                    <button class="delete">♙</button>
                </div>
            </div>

            <div class="note">
                <input type="checkbox" checked>
                <span>NOTE #2</span>
                <div class="actions">
                    <button class="edit">✎</button>
                    <button class="delete">♙</button>
                </div>
            </div>

            <div class="note">
                <input type="checkbox">
                <span>NOTE #3</span>
                <div class="actions">
                    <button class="edit">✎</button>
                    <button class="delete">♙</button>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
